<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sanctuary</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f0c29" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fce4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0c29" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Sanctuary" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Web App Manifest (Mandatory for iOS Web Push!) -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="./apple-touch-icon.png" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        // GitHub Pages: site is at /Sanctuary/ — tell OneSignal where to find its worker
        const isGHPages = window.location.pathname.startsWith('/Sanctuary');
        const basePath = isGHPages ? '/Sanctuary/' : '/';

        await OneSignal.init({
          appId: "c7325758-4905-4bff-8aa6-8c01feb6f215",
          // Use the dedicated OneSignal worker (not combined sw.js)
          // This avoids iOS Safari issues with Workbox async module loading
          serviceWorkerPath: isGHPages ? "Sanctuary/OneSignalSDKWorker.js" : "OneSignalSDKWorker.js",
          serviceWorkerUpdaterPath: isGHPages ? "Sanctuary/OneSignalSDKUpdaterWorker.js" : "OneSignalSDKUpdaterWorker.js",
          serviceWorkerParam: { scope: basePath },
          allowLocalhostAsSecureOrigin: true,
        });

        // Log subscription changes for debugging
        try {
          OneSignal.User.PushSubscription.addEventListener("change", function(event) {
            console.log("[OneSignal] Subscription changed:", JSON.stringify({
              id: event.current && event.current.id,
              token: event.current && event.current.token ? "present" : "null",
              optedIn: event.current && event.current.optedIn,
            }));
          });
        } catch(e) {
          console.warn("[OneSignal] Could not add subscription listener:", e);
        }
      });
    </script>
    <script type="module" crossorigin src="./assets/index-BHKU0GHi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJyhADjd.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Sanctuary</title>
    
    <!-- PWA & Mobile Meta Tags -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0f0c29" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fce4ec" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f0c29" />

    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Web App Manifest (Mandatory for iOS Web Push!) -->
    <link rel="manifest" href="./manifest.webmanifest" />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="./apple-touch-icon.png" />

    <!-- OneSignal Web Push SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        const isSubdirectory = window.location.pathname.startsWith('/Sanctuary');
        const basePath = isSubdirectory ? '/Sanctuary/' : '/';
        const swPath = isSubdirectory ? 'Sanctuary/sw.js' : 'sw.js';

        await OneSignal.init({
          appId: "c7325758-4905-4bff-8aa6-8c01feb6f215",
          path: basePath,
          serviceWorkerPath: swPath,
          serviceWorkerParam: { scope: basePath },
          allowLocalhostAsSecureOrigin: true,
        });

        OneSignal.User.PushSubscription.addEventListener("change", function(event) {
          console.log("[OneSignal] Subscription changed:", event);
          if (event.current && event.current.token) {
            console.log("[OneSignal] APNs/VAPID token acquired:", event.current.token);
          }
        });
      });
    </script>
    <script type="module" crossorigin src="./assets/index-DWNQrELi.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BJyhADjd.css">
  <link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script></head>
